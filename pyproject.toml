[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-wars-ai-v2"
version = "0.2.0"
description = "Budgeted hierarchical Advance Wars research engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.6,<3", "numpy>=1.24,<3"]

[project.scripts]
aw-v2 = "aw_ai.cli:main"
aw-v2-gui = "aw_ai.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aw_ai*"]
